name: Upload secret presence without declaration

on:
  workflow_call:

permissions: {}

jobs:
  presence:
    if: >-
      github.repository == 'scowalt/ignite-for-spotify-app' &&
      github.ref == 'refs/heads/main' &&
      github.event_name == 'workflow_dispatch' &&
      github.workflow_ref == 'scowalt/ignite-for-spotify-app/.github/workflows/diagnose-upload-secret.yml@refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Check presence only
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.GLITCHTIP_AUTH_TOKEN }}
        run: |
          if [ -n "$SENTRY_AUTH_TOKEN" ]; then
            echo '[DEBUG-secret-delivery:reusable] present'
          else
            echo '::error::[DEBUG-secret-delivery:reusable] absent'
            exit 1
          fi
