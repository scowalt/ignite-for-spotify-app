name: Diagnose upload secret presence

on:
  workflow_dispatch:

permissions: {}

jobs:
  direct:
    if: github.repository == 'scowalt/ignite-for-spotify-app' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Check presence only
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.GLITCHTIP_AUTH_TOKEN }}
        run: |
          if [ -n "$SENTRY_AUTH_TOKEN" ]; then
            echo '[DEBUG-secret-delivery:direct] present'
          else
            echo '::error::[DEBUG-secret-delivery:direct] absent'
            exit 1
          fi

  reusable:
    if: github.repository == 'scowalt/ignite-for-spotify-app' && github.ref == 'refs/heads/main'
    uses: ./.github/workflows/diagnose-upload-secret-reusable.yml

  declared:
    if: github.repository == 'scowalt/ignite-for-spotify-app' && github.ref == 'refs/heads/main'
    uses: ./.github/workflows/diagnose-upload-secret-declared.yml
    secrets:
      GLITCHTIP_AUTH_TOKEN: ${{ secrets.GLITCHTIP_AUTH_TOKEN }}
