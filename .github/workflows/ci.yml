name: CI

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  public-source:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Check publication boundaries
        run: |
          python3 scripts/check-public-source.py
          python3 -m unittest discover -s scripts -p 'test_public_source.py' -v

  publish:
    needs: [backend, frontend, backup, public-source]
    if: >-
      github.repository == 'scowalt/ignite-for-spotify-app' &&
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      vars.PRODUCTION_PUBLISHING_ENABLED == 'true'
    permissions:
      contents: read
      packages: write
      id-token: write
    uses: ./.github/workflows/deploy.yml
    secrets:
      GLITCHTIP_AUTH_TOKEN: ${{ secrets.GLITCHTIP_AUTH_TOKEN }}

  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Setup .NET 10
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with:
          dotnet-version: "10.0.402"

      - name: Restore dependencies
        run: dotnet restore backend/Ignite.slnx

      - name: Build
        run: dotnet build backend/Ignite.slnx --no-restore

      - name: Test
        run: dotnet test backend/Ignite.slnx --no-build --verbosity normal

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: "1.4.2"

      - name: Install dependencies
        run: cd frontend && bun install --frozen-lockfile

      - name: Test
        run: cd frontend && bun run test

      - name: Lint
        run: cd frontend && bun run lint

      - name: Type check
        run: cd frontend && bun run typecheck

      - name: Build
        run: cd frontend && bun run build

      - name: Verify pinned source-map upload protocol without credentials
        run: |
          mkdir -p "$RUNNER_TEMP/sourcemap-cli"
          bun add --cwd "$RUNNER_TEMP/sourcemap-cli" @sentry/cli@3.8.2
          SENTRY_CLI_EXECUTABLE="$RUNNER_TEMP/sourcemap-cli/node_modules/.bin/sentry-cli" \
            python3 -m unittest discover -s scripts -p test_sourcemap_protocol.py -v

  infrastructure:
    runs-on: ubuntu-latest
    env:
      TF_IN_AUTOMATION: "true"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Setup OpenTofu
        uses: opentofu/setup-opentofu@9d84900f3238fab8cd84ce47d658d25dd008be2f
        with:
          tofu_version: "1.13.2"
          tofu_wrapper: false

      - name: Validate isolated public-source infrastructure
        run: |
          tofu -chdir=infra/public-source init -backend=false -input=false -lockfile=readonly
          tofu -chdir=infra/public-source fmt -check -recursive
          tofu -chdir=infra/public-source validate
          tofu -chdir=infra/public-source test

  release-images:
    permissions:
      contents: read
    uses: ./.github/workflows/verify-images.yml

  backup:
    if: always()
    needs: [backup-tests, release-images, infrastructure]
    runs-on: ubuntu-latest
    steps:
      - name: Require backup, image and infrastructure verification
        env:
          BACKUP_RESULT: ${{ needs['backup-tests'].result }}
          IMAGE_RESULT: ${{ needs['release-images'].result }}
          INFRASTRUCTURE_RESULT: ${{ needs.infrastructure.result }}
        run: |
          test "$BACKUP_RESULT" = success
          test "$IMAGE_RESULT" = success
          test "$INFRASTRUCTURE_RESULT" = success

  backup-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Lint backup and image verification scripts
        run: shellcheck docker/backup/*.sh scripts/verify-release-image.sh

      - name: Test publication and cutover guards
        run: python3 -m unittest discover -s scripts -p 'test_*.py' -v

      - name: Setup pinned installer verification binary
        uses: sigstore/cosign-installer@b9c35392b7c1401bcc77d30c9b07cf4b1c7a7b07
        with:
          cosign-release: v3.1.4

      - name: Verify disabled operator installation with reviewed policy
        run: IGNITE_COSIGN_FIXTURE="$(command -v cosign)" python3 -m unittest discover -s scripts -p test_install_deployer.py -v

      - name: Build backup image
        run: docker build -f docker/Dockerfile.backup -t ignite-backup:test .

      - name: Exercise guarded deployment backup and restart cleanup
        run: sudo env IGNITE_BACKUP_FIXTURE_IMAGE=ignite-backup:test python3 -B -m unittest discover -s scripts -p test_deployment_backup.py -v

      - name: Exercise immutable record archive transport
        run: sudo env IGNITE_BACKUP_FIXTURE_IMAGE=ignite-backup:test python3 -B -m unittest discover -s scripts -p test_release_transport.py -v

      - name: Exercise production Docker metadata compatibility
        run: sudo env IGNITE_BACKUP_FIXTURE_IMAGE=ignite-backup:test python3 -B -m unittest discover -s scripts -p test_deployment_runtime.py -v

      - name: Exercise snapshot and isolated restore
        run: docker build --target test -f docker/Dockerfile.backup .

  controller:
    name: Controller (non-required)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: automation/glitchtip-paseo-controller
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Setup uv and Python 3.14.7
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e
        with:
          version: "0.12.19"
          python-version: "3.14.7"
          enable-cache: true
          cache-dependency-glob: automation/glitchtip-paseo-controller/uv.lock

      - name: Verify lock and install
        run: |
          uv lock --check
          uv sync --locked --all-groups

      - name: Test
        run: uv run --python 3.14.7 python -m unittest discover -s tests -v

      - name: Lint and format
        run: |
          uv run --python 3.14.7 ruff check .
          uv run --python 3.14.7 ruff format --check .

      - name: Strict type check
        run: uv run --python 3.14.7 pyright src

      - name: Fixture compatibility report
        run: |
          uv run --locked --python 3.14.7 glitchtip-paseo-controller report \
            --config config/controller.example.toml \
            --fixtures tests/fixtures \
            --capability glitchtip_api_token \
            --capability github_automation_token

      - name: Diff check
        run: git -C ../.. diff --check
