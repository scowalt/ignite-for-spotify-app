name: Deploy

on:
  workflow_call:
    secrets:
      GLITCHTIP_AUTH_TOKEN:
        required: true

env:
  REGISTRY: ghcr.io
  BACKEND_IMAGE: ghcr.io/scowalt/ignite-for-spotify-app/backend
  BACKUP_IMAGE: ghcr.io/scowalt/ignite-for-spotify-app/backup
  FRONTEND_IMAGE: ghcr.io/scowalt/ignite-for-spotify-app/frontend
  RELEASE_IMAGE: ghcr.io/scowalt/ignite-for-spotify-app/release

jobs:
  build-and-push:
    if: >-
      github.repository == 'scowalt/ignite-for-spotify-app' &&
      github.ref == 'refs/heads/main' &&
      github.workflow_ref == 'scowalt/ignite-for-spotify-app/.github/workflows/ci.yml@refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      vars.PRODUCTION_PUBLISHING_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: production
    concurrency:
      group: ignite-production-publisher
      cancel-in-progress: false
    permissions:
      contents: read
      packages: write
      id-token: write

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Verify release configuration
        env:
          CUTOVER_COMPLETE: ${{ vars.LOCAL_SQLITE_CUTOVER_COMPLETE }}
          VITE_POSTHOG_KEY: ${{ vars.VITE_POSTHOG_KEY }}
          VITE_SENTRY_DSN: ${{ vars.VITE_SENTRY_DSN }}
          SOURCEMAPS_ENABLED: ${{ vars.GLITCHTIP_SOURCEMAPS_ENABLED }}
          SENTRY_AUTH_TOKEN: ${{ secrets.GLITCHTIP_AUTH_TOKEN }}
        run: |
          test "$CUTOVER_COMPLETE" = true
          test -n "$VITE_POSTHOG_KEY"
          test -n "$VITE_SENTRY_DSN"
          if [ "$SOURCEMAPS_ENABLED" = true ] && [ -z "$SENTRY_AUTH_TOKEN" ]; then
            echo '::error::Enabled source maps require the protected upload credential.'
            exit 1
          fi

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: "1.4.2"

      - name: Build frontend
        env:
          VITE_POSTHOG_KEY: ${{ vars.VITE_POSTHOG_KEY }}
          VITE_SENTRY_DSN: ${{ vars.VITE_SENTRY_DSN }}
        run: |
          cd frontend
          bun install --frozen-lockfile
          bun run build

      - name: Upload source maps to GlitchTip
        if: vars.GLITCHTIP_SOURCEMAPS_ENABLED == 'true'
        run: |
          npx --yes @sentry/cli@3.8.2 sourcemaps inject frontend/dist
          npx --yes @sentry/cli@3.8.2 sourcemaps upload frontend/dist
        env:
          SENTRY_URL: https://glitchtip.scowalt.com
          SENTRY_AUTH_TOKEN: ${{ secrets.GLITCHTIP_AUTH_TOKEN }}
          SENTRY_ORG: ignite-for-spotify-app-frontend
          SENTRY_PROJECT: ignite-for-spotify-frontend

      - name: Remove source maps from the image input
        if: always()
        run: |
          if [ -d frontend/dist ]; then
            find frontend/dist -name '*.map' -delete
          fi

      - name: Log in to Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f

      - name: Extract metadata for backend
        id: meta-backend
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051
        with:
          images: ${{ env.BACKEND_IMAGE }}
          tags: |
            type=sha,prefix=
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' && vars.LOCAL_SQLITE_CUTOVER_COMPLETE == 'true' }}

      - name: Build backend image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
        with:
          context: .
          file: docker/Dockerfile.backend
          push: false
          load: true
          tags: ${{ steps.meta-backend.outputs.tags }}
          labels: ${{ steps.meta-backend.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Scan backend image with Trivy
        uses: aquasecurity/trivy-action@d2a0b60797ff03db6132bd4e2b293f9b37081297
        with:
          version: v0.72.0
          image-ref: ${{ env.BACKEND_IMAGE }}:${{ steps.meta-backend.outputs.version }}
          format: 'sarif'
          output: 'trivy-backend.sarif'
          scanners: 'vuln'

      - name: Enforce backend security gate
        env:
          IMAGE_REF: ${{ env.BACKEND_IMAGE }}:${{ steps.meta-backend.outputs.version }}
        run: |
          trivy image \
            --cache-dir "$GITHUB_WORKSPACE/.cache/trivy" \
            --scanners vuln \
            --ignore-unfixed \
            --severity HIGH,CRITICAL \
            --exit-code 1 \
            "$IMAGE_REF"
          if ! trivy image --quiet \
            --cache-dir "$GITHUB_WORKSPACE/.cache/trivy" \
            --scanners secret --format json \
            --output "$RUNNER_TEMP/backend-secret-scan.json" \
            --exit-code 1 "$IMAGE_REF"; then
            echo '::error::Secret scan failed; findings are not published in logs or artifacts.'
            exit 1
          fi

      - name: Extract metadata for backup
        id: meta-backup
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051
        with:
          images: ${{ env.BACKUP_IMAGE }}
          tags: |
            type=sha,prefix=
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' && vars.LOCAL_SQLITE_CUTOVER_COMPLETE == 'true' }}

      - name: Build backup image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
        with:
          context: .
          file: docker/Dockerfile.backup
          push: false
          load: true
          tags: ${{ steps.meta-backup.outputs.tags }}
          labels: ${{ steps.meta-backup.outputs.labels }}
          cache-from: type=gha,scope=backup
          cache-to: type=gha,mode=max,scope=backup

      - name: Scan backup image with Trivy
        uses: aquasecurity/trivy-action@d2a0b60797ff03db6132bd4e2b293f9b37081297
        with:
          version: v0.72.0
          image-ref: ${{ env.BACKUP_IMAGE }}:${{ steps.meta-backup.outputs.version }}
          format: 'sarif'
          output: 'trivy-backup.sarif'
          scanners: 'vuln'

      - name: Enforce backup security gate
        env:
          IMAGE_REF: ${{ env.BACKUP_IMAGE }}:${{ steps.meta-backup.outputs.version }}
        run: |
          trivy image \
            --cache-dir "$GITHUB_WORKSPACE/.cache/trivy" \
            --scanners vuln \
            --ignore-unfixed \
            --severity HIGH,CRITICAL \
            --exit-code 1 \
            "$IMAGE_REF"
          if ! trivy image --quiet \
            --cache-dir "$GITHUB_WORKSPACE/.cache/trivy" \
            --scanners secret --format json \
            --output "$RUNNER_TEMP/backup-secret-scan.json" \
            --exit-code 1 "$IMAGE_REF"; then
            echo '::error::Secret scan failed; findings are not published in logs or artifacts.'
            exit 1
          fi

      - name: Verify browser dependencies and collect notices
        run: |
          trivy fs --quiet --scanners vuln --ignore-unfixed --severity HIGH,CRITICAL \
            --exit-code 1 --skip-dirs frontend/node_modules frontend
          trivy fs --quiet --skip-dirs frontend/node_modules --format cyclonedx \
            --output "$RUNNER_TEMP/frontend.cdx.json" frontend
          python3 scripts/collect-frontend-notices.py \
            --sbom "$RUNNER_TEMP/frontend.cdx.json" --node-modules frontend/node_modules \
            --output frontend/dist/third-party-licenses

      - name: Extract metadata for frontend
        id: meta-frontend
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051
        with:
          images: ${{ env.FRONTEND_IMAGE }}
          tags: |
            type=sha,prefix=
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Build frontend image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
        with:
          context: .
          file: docker/Dockerfile.frontend
          push: false
          load: true
          tags: ${{ steps.meta-frontend.outputs.tags }}
          labels: ${{ steps.meta-frontend.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Scan frontend image with Trivy
        uses: aquasecurity/trivy-action@d2a0b60797ff03db6132bd4e2b293f9b37081297
        with:
          version: v0.72.0
          image-ref: ${{ env.FRONTEND_IMAGE }}:${{ steps.meta-frontend.outputs.version }}
          format: 'sarif'
          output: 'trivy-frontend.sarif'
          scanners: 'vuln'

      - name: Enforce frontend security gate
        env:
          IMAGE_REF: ${{ env.FRONTEND_IMAGE }}:${{ steps.meta-frontend.outputs.version }}
        run: |
          trivy image \
            --cache-dir "$GITHUB_WORKSPACE/.cache/trivy" \
            --scanners vuln \
            --ignore-unfixed \
            --severity HIGH,CRITICAL \
            --exit-code 1 \
            "$IMAGE_REF"
          if ! trivy image --quiet \
            --cache-dir "$GITHUB_WORKSPACE/.cache/trivy" \
            --scanners secret --format json \
            --output "$RUNNER_TEMP/frontend-secret-scan.json" \
            --exit-code 1 "$IMAGE_REF"; then
            echo '::error::Secret scan failed; findings are not published in logs or artifacts.'
            exit 1
          fi

      - name: Verify final image notices and security before any push
        env:
          BACKEND_REF: ${{ env.BACKEND_IMAGE }}:${{ steps.meta-backend.outputs.version }}
          BACKUP_REF: ${{ env.BACKUP_IMAGE }}:${{ steps.meta-backup.outputs.version }}
          FRONTEND_REF: ${{ env.FRONTEND_IMAGE }}:${{ steps.meta-frontend.outputs.version }}
        run: |
          sh scripts/verify-release-image.sh backend "$BACKEND_REF" "$RUNNER_TEMP/release-reports/backend"
          sh scripts/verify-release-image.sh backup "$BACKUP_REF" "$RUNNER_TEMP/release-reports/backup"
          sh scripts/verify-release-image.sh frontend "$FRONTEND_REF" "$RUNNER_TEMP/release-reports/frontend"

      - name: Verify current release head
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$(gh api repos/scowalt/ignite-for-spotify-app/commits/main --jq .sha)" = "$GITHUB_SHA"

      - name: Publish verified images
        run: |
          for image in "$BACKEND_IMAGE" "$BACKUP_IMAGE" "$FRONTEND_IMAGE"; do
            docker push --all-tags "$image"
          done

      - name: Install pinned release signer
        uses: sigstore/cosign-installer@b9c35392b7c1401bcc77d30c9b07cf4b1c7a7b07
        with:
          cosign-release: v3.1.4
          install-dir: ${{ runner.temp }}/cosign

      - name: Create coherent release record
        run: |
          printf '424e2c97d0b45fd7a6b608a87f090f35633f4c23ece5f092d48bba11aaf4bbfa  %s\n' "$(command -v cosign)" | sha256sum --check
          python3 scripts/prepare-release-record.py --root . --output "$RUNNER_TEMP/release/release.json"
          cp LICENSE "$RUNNER_TEMP/release/LICENSE"
          docker buildx build --load --platform linux/amd64 --provenance=false --sbom=false \
            --file ops/deployer/Dockerfile.release \
            --label "org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY" \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            --tag "$RELEASE_IMAGE:$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" "$RUNNER_TEMP/release"
          trivy image --quiet --scanners vuln --ignore-unfixed --severity HIGH,CRITICAL --exit-code 1 \
            "$RELEASE_IMAGE:$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          if ! trivy image --quiet --scanners secret --format json \
            --output "$RUNNER_TEMP/release-record-secret-scan.json" --exit-code 1 \
            "$RELEASE_IMAGE:$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"; then
            echo '::error::Release-record secret gate failed; raw findings withheld.'
            exit 1
          fi
          docker push "$RELEASE_IMAGE:$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"

      - name: Sign and verify release record
        run: |
          digest=$(docker buildx imagetools inspect "$RELEASE_IMAGE:$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" \
            --format '{{json .Manifest}}' | jq -er '.digest | select(test("^sha256:[a-f0-9]{64}$"))')
          cosign sign --yes "$RELEASE_IMAGE@$digest"
          cosign verify "$RELEASE_IMAGE@$digest" \
            --certificate-identity 'https://github.com/scowalt/ignite-for-spotify-app/.github/workflows/deploy.yml@refs/heads/main' \
            --certificate-oidc-issuer 'https://token.actions.githubusercontent.com' \
            --certificate-github-workflow-repository "$GITHUB_REPOSITORY" \
            --certificate-github-workflow-ref 'refs/heads/main' \
            --certificate-github-workflow-sha "$GITHUB_SHA"
          printf 'RELEASE_RECORD_DIGEST=%s\n' "$digest" >> "$GITHUB_ENV"

      - name: Promote signed release pointer
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$(gh api repos/scowalt/ignite-for-spotify-app/commits/main --jq .sha)" = "$GITHUB_SHA"
          docker tag "$RELEASE_IMAGE:$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" "$RELEASE_IMAGE:latest"
          docker push "$RELEASE_IMAGE:latest"
          actual=$(docker buildx imagetools inspect "$RELEASE_IMAGE:latest" --format '{{json .Manifest}}' | jq -er .digest)
          test "$actual" = "$RELEASE_RECORD_DIGEST"

      - name: Upload Trivy scan reports
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: trivy-sarif-${{ github.sha }}
          path: trivy-*.sarif
          if-no-files-found: warn
