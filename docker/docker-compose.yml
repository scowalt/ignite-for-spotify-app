services:
  backend:
    image: ignite-backend:latest
    container_name: ignite-backend
    restart: unless-stopped
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ConnectionStrings__Database=Data Source=/app/data/ignite.db;Default Timeout=60
      - ConnectionStrings__Hangfire=Data Source=/app/data/hangfire.db
      - Database__RequireExisting=false
      - Spotify__ClientId=${SPOTIFY_CLIENT_ID}
      - Spotify__ClientSecret=${SPOTIFY_CLIENT_SECRET}
      - Spotify__RedirectUri=${SPOTIFY_REDIRECT_URI:-https://ignite.example.com/api/auth/callback}
      - CdlcScraper__Username=${CDLC_SCRAPER_USERNAME:-}
      - CdlcScraper__Password=${CDLC_SCRAPER_PASSWORD:-}
      - CdlcScraper__CookieKey=${CDLC_SCRAPER_COOKIE_KEY:-}
      - CdlcScraper__CookieValue=${CDLC_SCRAPER_COOKIE_VALUE:-}
      - CdlcScraper__Cookies=${CDLC_SCRAPER_COOKIES:-}
      - Hangfire__DashboardPassword=${HANGFIRE_DASHBOARD_PASSWORD:-}
    ports:
      - "127.0.0.1:5050:5050"
    volumes:
      - ignite-data:/app/data
    networks:
      - ignite-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5050/health/ready"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s

  frontend:
    image: ignite-frontend:latest
    container_name: ignite-frontend
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:80"
    networks:
      - ignite-network
    depends_on:
      - backend

  caddy:
    image: caddy:2-alpine
    container_name: ignite-caddy
    restart: unless-stopped
    network_mode: host
    environment:
      - DOMAIN=${DOMAIN:-ignite.example.com}
    volumes:
      - ../Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - backend
      - frontend

volumes:
  ignite-data:
  caddy-data:
  caddy-config:

networks:
  ignite-network:
    driver: bridge
