[project]
name = "glitchtip-paseo-controller"
version = "0.1.0"
description = "Local Ignite GlitchTip/Paseo controller with guarded legacy cutover"
readme = "README.md"
requires-python = ">=3.15.2,<3.16"
dependencies = []

[dependency-groups]
dev = [
  "pyright==1.1.414",
  "ruff==0.17.4",
]

[project.scripts]
glitchtip-paseo-controller = "glitchtip_paseo_controller.cli:main"

[build-system]
requires = ["hatchling==1.33.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/glitchtip_paseo_controller"]

[tool.uv]
package = true

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP"]

[tool.pyright]
pythonVersion = "3.14"
typeCheckingMode = "strict"
